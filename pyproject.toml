[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "free-llm-router"
version = "0.1.0"
description = "OpenAI-compatible router for publicly available and free-tier cloud LLM APIs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
free-llm-router = "free_llm_router.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

